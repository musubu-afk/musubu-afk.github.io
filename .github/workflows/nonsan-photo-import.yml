name: Verify and import Nonsan licensed photos
on:
  push:
    branches: [photo-license-nonsan-20261127]
    paths: [tools/import-nonsan-licensed-photos.py]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python tools/import-nonsan-licensed-photos.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets explore.js phase-two.js index.html i18n.js
          git diff --cached --quiet || git commit -m "Replace Nonsan photos with verified licensed assets"
          git push origin HEAD:photo-license-nonsan-20261127
