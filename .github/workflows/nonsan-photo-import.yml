name: Validate licensed Nonsan photo replacement
on:
  push:
    branches: [photo-license-nonsan-20261127]
    paths: ['.github/workflows/nonsan-photo-import.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm untouched layout and unrelated features
        run: |
          git fetch origin main
          git diff --exit-code origin/main -- '*.css' 'assets/audio' 'assets/festivals' 'database' 'shops.js' 'app.js' 'review-photos.js' 'review-cards.js' 'map-explorer.js' 'assets/ohori.png' 'assets/yufuin.png'
          for f in explore.js phase-two.js i18n.js; do node --check "$f"; done
      - name: Run existing regression tests
        run: node --test tests/*.test.cjs
      - name: Validate photo assets, metadata and one-photo places
        run: |
          python - <<'PY'
          import pathlib, json, hashlib
          p=pathlib.Path
          root=p('assets/nonsan-photos')
          m=json.loads((root/'manifest.json').read_text())
          c=json.loads((root/'photo-credits.json').read_text())
          assert sorted(len(x['photos']) for x in m.values())==[1,1,3,3,3,3]
          assert len(c)==18
          for f,entry in c.items():
              assert hashlib.sha256(p(f).read_bytes()).hexdigest()==entry['published_sha256'], f
              assert entry['author'] and entry['source'].startswith('https://') and entry['licenseLinks']
              assert 'ND' not in entry['license'] and '제4유형' not in entry['license']
          expected={x for v in m.values() for x in v['photos']}
          assert expected=={str(x) for x in root.glob('*.jpg')}
          assert len(expected)==14
          assert set(c)==expected|{'assets/donam-seowon.jpg','assets/tapjeongho.jpg','assets/map-thumbs/donam-seowon.webp','assets/map-thumbs/tapjeongho.webp'}
          for f in ['gaetaesa-2.jpg','gaetaesa-3.jpg','gyeonhwon-tomb-2.jpg','gyeonhwon-tomb-3.jpg']:
              assert not (root/f).exists()
              for js in p('.').glob('*.js'):
                  assert ('assets/nonsan-photos/'+f) not in js.read_text(), str(js)
          assert 'licensedNonsanPhotoManifest' in p('explore.js').read_text()
          assert '사진 출처 및 이용조건' in p('phase-two.js').read_text()
          print('Validated all 16 display photos + 2 thumbnails and photo credits')
          PY
