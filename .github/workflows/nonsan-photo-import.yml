name: Validate licensed Nonsan photo replacement
on:
  push:
    branches: [photo-license-nonsan-20261127]
    paths: ['.github/workflows/nonsan-photo-import.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm untouched layout and unrelated features
        run: |
          git fetch origin main
          git diff --exit-code origin/main -- '*.css' 'assets/audio' 'assets/festivals' 'database' 'shops.js' 'app.js' 'review-photos.js' 'review-cards.js' 'map-explorer.js' 'assets/ohori.png' 'assets/yufuin.png'
          for f in explore.js phase-two.js i18n.js; do node --check "$f"; done
      - name: Run existing regression tests
        run: node --test tests/*.test.cjs
      - name: Validate photo assets, metadata and one-photo places
        run: |
          python - <<'PY'
          import pathlib, json, hashlib
          p=pathlib.Path
          root=p('assets/nonsan-photos')
          m=json.loads((root/'manifest.json').read_text())
          c=json.loads((root/'photo-credits.json').read_text())
          assert sorted(len(x['photos']) for x in m.values())==[1,1,3,3,3,3]
          assert len(c)==18
          for f,entry in c.items():
              assert hashlib.sha256(p(f).read_bytes()).hexdigest()==entry['published_sha256'], f
              assert entry['author'] and entry['source'].startswith('https://') and entry['licenseLinks']
              assert 'ND' not in entry['license'] and '제4유형' not in entry['license']
          expected={x for v in m.values() for x in v['photos']}
          assert expected=={str(x) for x in root.glob('*.jpg')}
          assert len(expected)==14
          assert set(c)==expected|{'assets/donam-seowon.jpg','assets/tapjeongho.jpg','assets/map-thumbs/donam-seowon.webp','assets/map-thumbs/tapjeongho.webp'}
          for f in ['gaetaesa-2.jpg','gaetaesa-3.jpg','gyeonhwon-tomb-2.jpg','gyeonhwon-tomb-3.jpg']:
              assert not (root/f).exists()
              for js in p('.').glob('*.js'):
                  assert ('assets/nonsan-photos/'+f) not in js.read_text(), str(js)
          assert 'licensedNonsanPhotoManifest' in p('explore.js').read_text()
          assert '사진 출처 및 이용조건' in p('phase-two.js').read_text()
          print('Validated all 16 display photos + 2 thumbnails and photo credits')
          PY
      - name: Install browser testing tools
        run: |
          npm install --prefix /tmp/musubu-browser --no-package-lock playwright
          /tmp/musubu-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser smoke tests on the actual site
        run: |
          python -m http.server 8765 > /tmp/musubu-http.log 2>&1 &
          NODE_PATH=/tmp/musubu-browser/node_modules node - <<'JS'
          const { chromium }=require('playwright');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const manifest=JSON.parse(fs.readFileSync('assets/nonsan-photos/manifest.json','utf8'));
            const credits=JSON.parse(fs.readFileSync('assets/nonsan-photos/photo-credits.json','utf8'));
            fs.mkdirSync('/tmp/musubu-previews',{recursive:true});
            for(const [name,viewport,lang] of [['desktop',{width:1440,height:1000},'ko'],['mobile',{width:390,height:844},'ja']]){
              const page=await browser.newPage({viewport, reducedMotion:'reduce'});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://127.0.0.1:8765/index.html?region=nonsan&lang='+lang,{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>window.MUSUBU_EXPLORE?.places?.filter(p=>p.region==='nonsan'&&p.kind==='official').length>=8,{},{timeout:60000});
              const rows=await page.evaluate(()=>window.MUSUBU_EXPLORE.places.filter(p=>p.region==='nonsan'&&p.kind==='official').map(p=>({id:p.id,story:p.story_key,name:p.name,photos:p.photos,image:p.image_url})));
              const target=rows.filter(p=>manifest[p.id]||['donam','tapjeong'].includes(p.story));
              assert.equal(target.length,8);
              for(const row of target){
                assert(credits[row.image],row.name+' has a licensed hero');
                assert.deepEqual(row.photos,manifest[row.id]?.photos||[row.image]);
                await page.evaluate(id=>{const X=window.MUSUBU_EXPLORE;X.choose(X.places.find(p=>p.id===id));X.openDetail();},row.id);
                const hero=page.locator('#placeDialog .p2-hero');
                await hero.waitFor({state:'visible'});
                await page.waitForFunction(()=>{let i=document.querySelector('#placeDialog .p2-hero');return i.complete&&i.naturalWidth>0});
                assert.equal(await hero.getAttribute('src'),row.image);
                assert.equal(await hero.evaluate(e=>getComputedStyle(e).objectFit),'cover');
                const credit=page.locator('#placeDialog .place-photo-credit summary');
                await credit.scrollIntoViewIfNeeded();await credit.click();
                assert(await page.locator('#placeDialog .place-photo-credit a').count()>=2);
                await page.locator('#placeDialog .p2-gallery-head button').click();
                await page.locator('.p2-viewer').waitFor({state:'visible'});
                assert.equal(await page.locator('.p2-viewer img').count(),row.photos.length);
                assert.equal(await page.locator('.p2-viewer .licensed-photo-viewer-credit').count(),row.photos.length);
                await page.locator('.p2-viewer button').first().click();
                await page.locator('#placeDialog .place-scroll').evaluate(e=>e.scrollTop=0);
                await page.screenshot({path:'/tmp/musubu-previews/'+name+'-'+row.id+'.png'});
                await page.locator('#placeDialog [data-close-place]').click();
              }
              assert.deepEqual(errors,[]);
              console.log(name,lang,'verified',target.length,'attractions, cover and attribution');
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Save browser preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nonsan-photo-previews
          path: /tmp/musubu-previews/
          if-no-files-found: ignore
